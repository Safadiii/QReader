# Render blueprint: the FastAPI backend and its PostgreSQL database.
# In Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: qreader-api
    runtime: python
    plan: free # sleeps when idle; switch to "starter" for a real cafe
    buildCommand: pip install -r requirements.txt
    # Creates any missing tables, then starts the API.
    startCommand: python -m database.init_db && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: qreader-db
          property: connectionString
      - key: API_KEY
        generateValue: true # copy this value into Vercel as QREADER_API_KEY
      - key: TRACKING_BASE_URL
        sync: false # set to https://<your-vercel-app>.vercel.app/track
      - key: QR_TTL_MINUTES
        value: "1440"
      # Push notifications: fill these in when you have the keys (see .env.example).
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

databases:
  - name: qreader-db
    plan: free
